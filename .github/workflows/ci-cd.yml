name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  PROJECT: realm-asgard
  REGION: asia-south1
  SERVICE: ai-intern-agent
  IMAGE: asia-south1-docker.pkg.dev/realm-asgard/intern/agent

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Update coverage report
        uses: ncruces/go-coverage-report@v0
        with:
          report: true
          chart: true
          amend: true
        if: github.event_name == 'push'
        continue-on-error: true

  release:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for proper version calculation

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Determine next version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE:)"
          minor_pattern: "(feat)"
          version_format: "${major}.${minor}.${patch}"
          search_commit_body: true
          bump_each_commit: false

      - name: Check if version changed
        id: version_check
        run: |
          if [ "${{ steps.semver.outputs.version }}" != "${{ steps.semver.outputs.current_version }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build binary
        if: steps.version_check.outputs.changed == 'true'
        run: |
          make build
          cd build
          tar -czf agent-linux-amd64.tar.gz agent

      - name: Create Release
        if: steps.version_check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semver.outputs.version }}
          name: Release v${{ steps.semver.outputs.version }}
          body: |
            ## Changes in v${{ steps.semver.outputs.version }}

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.semver.outputs.previous_version }}...v${{ steps.semver.outputs.version }}

            ### Installation

            Download the binary for your platform and extract:
            ```bash
            tar -xzf agent-linux-amd64.tar.gz
            ./agent --help
            ```
          files: build/agent-linux-amd64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true

  deploy:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: realm-asgard # grants access to environment-scoped secrets GCP_WIF_PROVIDER + GCP_CI_SA
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          # Set GCP_WIF_PROVIDER under repo/org Settings → Secrets and variables → Actions → Secrets
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          # Set GCP_CI_SA under repo/org Settings → Secrets and variables → Actions → Secrets
          service_account: ${{ secrets.GCP_CI_SA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT }}
